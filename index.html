  rel="stylesheet" />
<style>
  /* Hide scrollbar for Chrome, Safari and Opera */
  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }

  /* Hide scrollbar for IE, Edge and Firefox */
  .no-scrollbar {
    -ms-overflow-style: none;
    /* IE and Edge */
    scrollbar-width: none;
    /* Firefox */
  }

  /* Show posts and comments exactly as written: keep line breaks, blank lines,
     indentation and tabs, and wrap long words/links instead of overflowing. */
  .post-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    tab-size: 4;
  }

  /* Inside the app (feed, map, chat...) scroll areas behave like a native app:
     scrollable, but without a visible scrollbar. */
  .app-shell,
  .app-shell * {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .app-shell::-webkit-scrollbar,
  .app-shell *::-webkit-scrollbar {
    display: none;
  }

  /* Native mobile app behavior */
  body {
    overscroll-behavior-y: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  * {
    user-select: none;
  }

  input,
  textarea {
    user-select: auto;
  }
</style>

</head>
