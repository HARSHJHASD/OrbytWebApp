<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ["Plus Jakarta Sans", "sans-serif"],
          display: ["Bricolage Grotesque", "Plus Jakarta Sans", "sans-serif"],
        },
        // Orbyt design tokens (shared with the native app):
        //  - primary = Orbyt blue, the brand colour for actions and selection
        //  - rose/red stay reserved for social moments (likes, waves, matches)
        //  - slate is retuned to the night-navy surfaces, so every bg-slate-* /
        //    border-slate-* in the app picks up the new look automatically
        colors: {
          primary: {
            50: "#EEF3FF",
            100: "#DCE6FF",
            200: "#B9CCFF",
            300: "#8FAEFF",
            400: "#6B91FF",
            500: "#4F7CFF",
            600: "#3563F0",
            700: "#2A4FCC",
            800: "#233F9F",
            900: "#1E347D",
          },
          slate: {
            50: "#F6F8FD",
            100: "#ECF0FA",
            200: "#DCE3F5",
            300: "#C2CBE6",
            400: "#98A3C7",
            500: "#6B76A0",
            600: "#45507A",
            700: "#2A3560",
            800: "#1A2347",
            900: "#0D1430",
            950: "#070B1A",
          },
        },
      },
    },
  };
</script>
<style>
  /* Hide scrollbar for Chrome, Safari and Opera */
  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }

  /* Hide scrollbar for IE, Edge and Firefox */
  .no-scrollbar {
    -ms-overflow-style: none;
    /* IE and Edge */
    scrollbar-width: none;
    /* Firefox */
  }

  /* Show posts and comments exactly as written: keep line breaks, blank lines,
     indentation and tabs, and wrap long words/links instead of overflowing. */
  .post-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    tab-size: 4;
  }

  /* Inside the app (feed, map, chat...) scroll areas behave like a native app:
     scrollable, but without a visible scrollbar. */
  .app-shell,
  .app-shell * {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .app-shell::-webkit-scrollbar,
  .app-shell *::-webkit-scrollbar {
    display: none;
  }

  /* Native mobile app behavior */
  body {
    overscroll-behavior-y: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  * {
    user-select: none;
  }

  input,
  textarea {
    user-select: auto;
  }
</style>
